---
# 具身智能行业周报配置
# 每周一次，检索行业信号，输出 Obsidian-ready 图文周报

metadata:
  version: "1.0"
  last_updated: "2025-05-04"

# 周报结构
sections:
  - id: "headlines"
    name_cn: "本周头条"
    description: "3 条最重要的行业新闻，每条约 150 字 + 图片"
    max_items: 3

  - id: "company-radar"
    name_cn: "公司动态速览"
    description: "本周有动作的公司清单，每家公司 1-2 句话，侧重变化而非全面覆盖"
    max_items: 10

  - id: "funding-flash"
    name_cn: "融资快讯"
    description: "本周融资事件表格，只列关键信息"
    fields: ["公司", "轮次", "金额", "投资方"]

  - id: "tech-signal"
    name_cn: "技术信号"
    description: "本周值得关注的技术进展/论文/开源发布，1-2 条"
    max_items: 2

  - id: "product-update"
    name_cn: "产品动态 / 拆解信号"
    description: "新品、改规格、改价；完整拆解交给 product-teardown"
    max_items: 3

  - id: "lenses"
    name_cn: "九镜扫描"
    description: "公司洞察、技术雷达、产业链、市场、场景、投融资解读、政策；无信号写本周无新增"

  - id: "what-to-watch"
    name_cn: "下周关注"
    description: "下周可能发生的事件、预计发布、会议日程"

  - id: "pm-note"
    name_cn: "PM 随想"
    description: "本周对产品经理最有启发的一个洞察"

# 九镜搜索：公司 / 融资 / 产品 / 技术 / 供应链 / 市场场景 / 政策
search:
  templates:
    en:
      - "\"humanoid robot\" OR \"embodied AI\" news announcement {week_range}"
      - "Figure AI Tesla Optimus Boston Dynamics 1X Agility Unitree Agibot news {week_range}"
      - "robotics funding investment round valuation {week_range}"
      - "\"robot\" product launch demo teardown specs {week_range}"
      - "VLA dexterous manipulation humanoid locomotion Sim2Real tactile {week_range}"
      - "robot actuator harmonic drive sensor Jetson supply chain {week_range}"
      - "humanoid robot market size factory warehouse deployment policy {week_range}"
    zh:
      - "具身智能 OR 人形机器人 新闻 动态 {week_range}"
      - "宇树 智元 傅利叶 优必选 星海图 星动纪元 逐际动力 融资 产品 {week_range}"
      - "人形机器人 融资 估值 投资 {week_range}"
      - "人形机器人 新品 发布 拆解 规格 {week_range}"
      - "具身 基础模型 灵巧操作 遥操作 执行器 减速器 国产替代 {week_range}"
      - "人形机器人 市场规模 工厂 仓储 落地 政策 工信部 {week_range}"
  preferred_domains:
    english:
      - "techcrunch.com"
      - "theverge.com"
      - "reuters.com"
      - "bloomberg.com"
    chinese:
      - "36kr.com"
      - "jiqizhixin.com"
      - "leiphone.com"
      - "thepaper.cn"

# Obsidian 输出配置
obsidian:
  vault_env_var: "OBSIDIAN_VAULT_PATH"
  output_folder: "具身学习/News"
  filename_template: "{YYYY-MM-DD}_具身智能周报.md"
  image_folder: "具身学习/News/assets"

# 图片策略
image_strategy:
  priority:
    - "从新闻原文中提取主图（WebFetch 获取图片 URL）"
    - "引用已有论文笔记中的图片（![[paper_images/xxx.png]]）"
    - "标注 '暂无图片'，不强制配图"
  max_images_per_brief: 5
  preferred_size: "400"
  note: "图片 URL 优先使用原始链接，必要时下载到 vault 的 90_Assets 目录"

