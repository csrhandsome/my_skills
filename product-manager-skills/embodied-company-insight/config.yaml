# 搜索 query 模板
search_templates:
  team:
    en: |
      "{company_en} founder ceo cto team background ex-Google ex-Tesla"
      "{company_en} key people hires leadership"
    zh: |
      "{company_zh} 创始人 团队 背景 经历 前"
      "{company_zh} 核心团队 招聘 规模"

  funding:
    en: |
      "{company_en} funding round series valuation Crunchbase"
      "{company_en} investors venture capital funding history"
    zh: |
      "{company_zh} 融资 估值 投资方 轮次"
