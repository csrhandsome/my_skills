# 具身智能政策法规追踪配置
# 覆盖主要经济体的产业政策、安全标准、伦理规范

metadata:
  version: "1.0"
  last_updated: "2025-05-04"

# 政策分类
policy_categories:
  - id: "industrial-policy"
    name_cn: "产业政策/补贴"
    description: "政府专项基金、税收优惠、产业园政策"
    impact_level: "high"
    watch_frequency: "quarterly"

  - id: "safety-standards"
    name_cn: "安全标准/认证"
    description: "人形机器人安全标准、功能安全认证、碰撞测试"
    impact_level: "critical"
    watch_frequency: "monthly"

  - id: "ethics-regulation"
    name_cn: "伦理/监管"
    description: "AI 伦理指南、机器人权利、隐私保护"
    impact_level: "medium"
    watch_frequency: "quarterly"

  - id: "export-control"
    name_cn: "出口管制"
    description: "芯片/技术出口限制、实体清单、技术封锁"
    impact_level: "high"
    watch_frequency: "monthly"

  - id: "talent-policy"
    name_cn: "人才政策"
    description: "机器人/AI 人才培养、海外人才引进"
    impact_level: "medium"
    watch_frequency: "yearly"

  - id: "ip-protection"
    name_cn: "知识产权"
    description: "机器人相关专利政策、标准必要专利"
    impact_level: "medium"
    watch_frequency: "yearly"

