# 政策影响分析框架
impact_framework:
  dimensions:
    - name: "直接影响"
      description: "直接影响产品设计/生产/销售/定价的政策"
    - name: "间接影响"
      description: "影响生态/供应链/人才/资本流动的政策"
    - name: "时间窗口"
      description: "政策生效前有多少准备时间（立即/6月/1年/2年+）"
  risk_levels:
    critical: "可能导致产品无法上市或市场准入被拒"
    high: "显著增加成本或限制市场"
    medium: "需要调整部分设计或流程"
    low: "关注即可，短期无影响"

