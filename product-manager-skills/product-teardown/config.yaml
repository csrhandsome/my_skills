---
# 具身智能竞品产品拆解配置
# 产品数据库，标准化规格模板，对比维度定义

metadata:
  version: "1.0"
  last_updated: "2025-04-30"
  description: "Embodied AI Product Teardown — 竞品产品拆解与对比"

# 产品对比维度定义
dimensions:
  hardware:
    label: "硬件规格"
    weight: 0.25
    fields:
      - dof_total          # 总自由度
      - dof_arms           # 手臂自由度（单臂）
      - dof_hands          # 手部自由度（单手）
      - height             # 身高 (m)
      - weight             # 体重 (kg)
      - payload_per_arm    # 单臂负载 (kg)
      - battery_life       # 续航 (h)
      - speed              # 行走速度 (m/s)
      - joint_torque       # 关节扭矩 (Nm)

  actuation:
    label: "执行器"
    weight: 0.15
    fields:
      - actuator_type      # 执行器类型（旋转/直线/SEA/QDD/液压）
      - gear_type          # 减速器类型
      - self_developed     # 是否自研执行器
      - backdrivability    # 反向驱动力

  sensing:
    label: "传感器"
    weight: 0.15
    fields:
      - cameras            # 相机配置
      - depth_sensor       # 深度传感器
      - tactile            # 触觉传感器
      - imu                # IMU
      - force_torque       # 力/力矩传感器
      - proprioception     # 本体感知

  compute:
    label: "计算平台"
    weight: 0.10
    fields:
      - onboard_chip       # 端侧芯片
      - compute_tops       # AI 算力 (TOPS)
      - edge_cloud_split   # 端云分工
      - inference_latency  # 推理延迟 (ms)

  software:
    label: "软件栈"
    weight: 0.20
    fields:
      - foundation_model   # 基础模型
      - training_paradigm  # 训练范式
      - sim_platform       # 仿真平台
      - autonomy_level     # 自主等级
      - multi_modal        # 多模态能力
      - api_openness       # API 开放性

  commercial:
    label: "商业化"
    weight: 0.15
    fields:
      - price              # 价格
      - target_price       # 目标价格
      - production_status  # 量产状态
      - target_use_case    # 目标场景
      - customers          # 已知客户
      - delivery_timeline  # 交付时间线

